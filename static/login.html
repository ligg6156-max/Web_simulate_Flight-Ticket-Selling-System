<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!--Optional: Enhanced version -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Optional: Enhanced version -->
    <title>26016958d - Drinking Order System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="scripts/header.css" rel="stylesheet">
  </head>

<body class="d-flex flex-column min-vh-100">
  <svg xmlns="http://www.w3.org/2000/svg"
       class="d-none"
       aria-hidden="true">
    <symbol id="icon-plane" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4Z"/>
      <path d="M22 2 11 13"/>
    </symbol>

    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <path d="m16 16 5 5"/>
    </symbol>

    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6"/>
    </symbol>

    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </symbol>
  </svg>

  <header class="bg-white border-bottom">
    <nav class="navbar navbar-expand-lg py-3" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold"
           href="Dashboard.html">
          <span class="brand-icon d-flex align-items-center justify-content-center">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-plane"></use>
            </svg>
          </span>

          <span>
            SkyBlue<span class="text-primary">.</span>
            <small class="d-block text-secondary"
                   style="font-size: .59rem; letter-spacing: 3px;">
              AIRWAYS
            </small>
          </span>
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav mx-auto gap-lg-4 my-3 my-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#flights" aria-current="page">
                Book a flight
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#destinations">Destinations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#offers">Special offers</a>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-3">
            <span class="small text-secondary">EN · HKD</span>
            <a href="Register.html"
               class="btn btn-outline-primary rounded-pill px-3"
               title="register">
              <svg class="icon me-1" aria-hidden="true">
                <use href="#icon-user"></use>
              </svg>
              Register
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <form id="loginForm" class="text-center">
            <div class="mb-3 d-flex align-items-center justify-content-center">
              <label for="username" class="form-label me-2 mb-0">Username</label>
              <input type="text" class="form-control w-auto" id="username" name="username" required>
            </div>
            <div class="mb-3 d-flex align-items-center justify-content-center">
              <label for="password" class="form-label me-2 mb-0">Password</label>
              <input type="password" class="form-control w-auto" id="password" name="password" required>
            </div>
            <button type="submit" id="btn-login" class="btn btn-primary">Login</button>
            <p id="loginStatus" class="mt-3 mb-0" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
  </main>

  <footer class="bg-white border-top py-4">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <div class="fw-bold mb-1">
            SkyBlue<span class="text-primary">.</span> Airways
          </div>
          <p class="small text-secondary mb-0">
            A better journey, from the very beginning.
          </p>
        </div>

        <div class="d-flex flex-wrap gap-4 small">
          <a class="footer-link" href="#flights">Find flights</a>
          <a class="footer-link" href="#destinations">Destinations</a>
          <a class="footer-link" href="#offers">Fare benefits</a>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex flex-wrap justify-content-between gap-2 small text-secondary">
        <div id="user-menu" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>
          <span>© 2026 SkyBlue Airways · Student project</span>
          <span>Interface prototype · No real bookings or payments</span>
      </div>
    </div>
  </footer>

    <script src="scripts/login.js"></script>
</body>

</html>
