<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!--Optional: Enhanced version -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Optional: Enhanced version -->
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class ="bg-dark text-white text-center py-4">
        <h1>Login</h1>
    </header>

  <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <form action="/auth/login" method="POST" class="text-center">
            <div class="mb-3 d-flex align-items-center justify-content-center">
              <label for="username" class="form-label me-2 mb-0">Username</label>
              <input type="text" class="form-control w-auto" id="username" name="username" required>
            </div>
            <div class="mb-3 d-flex align-items-center justify-content-center">
              <label for="password" class="form-label me-2 mb-0">Password</label>
              <input type="password" class="form-control w-auto" id="password" name="password" required>
            </div>
            <button type="button" id="btn-login" class="btn btn-primary">Login</button>
          <form>
        </div>
      </div>
  </main>

    <footer class="bg-dark text-white text-center p-3">
        <p>© 26016958d © Leung Ka Chun - EIE4432 Lab 4 Project</p>
    </footer>

    <script src="scripts/login.js"></script>
</body>

</html>
