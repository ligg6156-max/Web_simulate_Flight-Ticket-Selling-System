<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - SkyBlue Airways</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="scripts/header.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="bg-white border-bottom">
    <nav class="navbar py-3" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold" href="Dashboard.html">
          SkyBlue<span class="text-primary">.</span> Airways
        </a>
        <a href="login.html" data-auth-action
           class="btn btn-outline-primary rounded-pill px-3">Sign in</a>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center g-4">
      <div class="col-lg-7">
        <h1 class="h3 fw-bold mb-4">Payment information</h1>

        <div class="card p-4 mb-4">
          <h2 class="h5 mb-3">Buyer information</h2>
          <form id="paymentForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="buyerName">Full name</label>
                <input class="form-control" id="buyerName" name="buyerName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="buyerEmail">Email</label>
                <input class="form-control" id="buyerEmail" name="buyerEmail" type="email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="cardName">Name on card</label>
                <input class="form-control" id="cardName" name="cardName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="cardNumber">Card number</label>
                <input class="form-control" id="cardNumber" name="cardNumber"
                  inputmode="numeric" autocomplete="cc-number" maxlength="19"
                  placeholder="0000 0000 0000 0000" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="expiry">Expiry date</label>
                <input class="form-control" id="expiry" name="expiry"
                  inputmode="numeric" autocomplete="cc-exp" maxlength="5"
                  placeholder="MM/YY" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="cvv">CVV</label>
                <input class="form-control" id="cvv" name="cvv"
                  inputmode="numeric" autocomplete="cc-csc" maxlength="4"
                  placeholder="123" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4" id="payButton">
              Pay now
            </button>
          </form>
          <p id="paymentStatus" class="mt-3 mb-0 fw-bold" role="status"></p>
          <div id="receipt" class="mt-4 border-top pt-4" hidden></div>
        </div>
      </div>

      <aside class="col-lg-4">
        <div class="card p-4">
          <h2 class="h5 mb-3">Booking summary</h2>
          <div id="bookingSummary"></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-white border-top py-4 mt-auto">
    <div class="container small text-secondary">
      © 2026 SkyBlue Airways · Student project
    </div>
  </footer>

  <script src="scripts/Payment.js"></script>
  <script src="scripts/auth-nav.js"></script>
</body>
</html>
