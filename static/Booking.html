<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book your flight - SkyBlue Airways</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="scripts/header.css" rel="stylesheet">
  <style>
    .seat-map {
      display: grid;
      grid-template-columns: repeat(8, 44px);
      gap: 10px;
      justify-content: center;
    }

    .seat-row-label,
    .seat-col-label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      font-size: .75rem;
      color: #65788a;
    }

    .seat {
      width: 44px;
      height: 44px;
      border: 2px solid #198754;
      border-radius: 8px 8px 12px 12px;
      background: #d1e7dd;
      color: #0f5132;
      font-weight: 700;
      cursor: pointer;
    }

    .seat.occupied {
      border-color: #dc3545;
      background: #f8d7da;
      color: #842029;
      cursor: not-allowed;
    }

    .seat.selected {
      border-color: #087fbd;
      background: #087fbd;
      color: #fff;
    }

    .seat-legend {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-block;
    }

    .seat-legend.available { background: #d1e7dd; border: 2px solid #198754; }
    .seat-legend.selected { background: #087fbd; border: 2px solid #087fbd; }
    .seat-legend.occupied { background: #f8d7da; border: 2px solid #dc3545; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="bg-white border-bottom">
    <nav class="navbar py-3" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold" href="Dashboard.html">
          SkyBlue<span class="text-primary">.</span> Airways
        </a>
        <a href="login.html" data-auth-action
           class="btn btn-outline-primary rounded-pill px-3">Sign in</a>
      </div>
    </nav>
  </header>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="h3 fw-bold mb-4">Book your flight</h1>
        <div id="flightSummary" class="card p-4"></div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-4">
    <div class="container small text-secondary">
      © 2026 SkyBlue Airways · Student project
    </div>
  </footer>

  <script src="scripts/Booking.js"></script>
  <script src="scripts/auth-nav.js"></script>
</body>
</html>
